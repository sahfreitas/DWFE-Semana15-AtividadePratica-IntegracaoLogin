<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/login/style.css">
    <script src="./assets/js/login.js" type="module"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="titulo">Meu site Ecommerce</h1>
        </header>
        <div class="overlay">
            <section class="modal">
                <h1>Login</h1>
                <form>
                    <label>Usuario</label>
                    <input id="username" type="text" placeholder="Informe seu usuário">
                    <label>Senha</label>
                    <input id="senha" type="password" placeholder="Informe sua senha">
                    <p class="esqueceu-container">
                        <a href="#" class="esqueceu">Esqueceu sua senha?</a>
                    </p>
                    <button>Entrar</button>

                    <div class="divider">
                        <div class="divider-line"></div>
                        <span class="divider-text">ou</span>
                        <div class="divider-line"></div>
                    </div>
                    <p class="cadastro-link">Não tem conta? <a href="">Cadastre-se</a></p>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
