<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo – Meu Ecommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/home/style.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <div class="logo-mark"><span>M</span></div>
            <h1>Meu Ecommerce</h1>
        </div>
        <input id="search" type="search" placeholder="Buscar produto...">
        <nav class="header-nav">
            <a href="./favoritos.html">♡ Favoritos</a>
            <a href="./graficos.html">Gráficos</a>
            <button id="btnLogout" class="btn-logout" title="Sair">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Sair</span>
            </button>
        </nav>
    </header>

    <main class="container-fluid px-4 py-3">
        <div class="toolbar mb-3">
            <select id="category">
                <option value="todas">Todas</option>
            </select>
            <button id="btnRender">Renderizar</button>
        </div>

        <div id="product-list" class="row g-3"></div>
        <div id="product-details"></div>
    </main>

    <footer>
        <span>© 2026 Meu Site Ecommerce 🎀🧣💄</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
        document.getElementById("btnLogout").addEventListener("click", () => {
            sessionStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
